<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | IAP Howrah</title>
  <meta name="description" content="View the photo gallery of IAP Howrah events and conferences.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Placeholder -->
  <div id="nav-placeholder"></div>

  <!-- Page Header -->
  <header class="page-header">
    <div class="container animate-on-scroll">
      <h1>Photo Gallery</h1>
      <div class="divider"></div>
      <p>Memories from our past events and initiatives</p>
    </div>
  </header>

  <main class="section">
    <div class="container">
      
      <div class="gallery-grid animate-on-scroll">
        <!-- Placeholder Images -->
        <div class="gallery-item" data-src="">
          <div class="gallery-placeholder"><span>📷</span><span>Photo 1</span></div>
        </div>
        <div class="gallery-item" data-src="">
           <div class="gallery-placeholder"><span>📷</span><span>Photo 2</span></div>
        </div>
        <div class="gallery-item" data-src="">
           <div class="gallery-placeholder"><span>📷</span><span>Photo 3</span></div>
        </div>
        <div class="gallery-item" data-src="">
           <div class="gallery-placeholder"><span>📷</span><span>Photo 4</span></div>
        </div>
        <div class="gallery-item" data-src="">
           <div class="gallery-placeholder"><span>📷</span><span>Photo 5</span></div>
        </div>
        <div class="gallery-item" data-src="">
           <div class="gallery-placeholder"><span>📷</span><span>Photo 6</span></div>
        </div>
        <div class="gallery-item" data-src="">
           <div class="gallery-placeholder"><span>📷</span><span>Photo 7</span></div>
        </div>
        <div class="gallery-item" data-src="">
           <div class="gallery-placeholder"><span>📷</span><span>Photo 8</span></div>
        </div>
      </div>

    </div>
  </main>

  <!-- Lightbox (hidden by default) -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close">&times;</button>
    <button class="lightbox-nav lightbox-prev">&#10094;</button>
    <img src="" alt="Gallery Image" class="lightbox-img">
    <button class="lightbox-nav lightbox-next">&#10095;</button>
  </div>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Loader -->
  <div class="loader-overlay">
    <div class="loader-spinner"></div>
    <div class="loader-text">Loading</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
